<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Build and manage your restaurant recipe menu">
    <title>Recipe Menu — Smart RestoInventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-content">
        <header class="top-bar" id="topbar-container"></header>
        <div class="page-content">

            <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h1>Recipe Menu</h1>
                    <p>Build dishes from inventory ingredients and manage pricing</p>
                </div>
                <button class="btn btn-primary-custom no-print" onclick="openDishForm()">
                    <i class="bi bi-plus-lg me-1"></i> Add Dish
                </button>
            </div>

            <!-- Dish cards -->
            <div class="row g-3" id="dishList"></div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <span class="empty-state-icon">📖</span>
                <p>No dishes on the menu yet. Click "Add Dish" to create your first recipe.</p>
            </div>

        </div>
    </main>
</div>

<!-- Add/Edit Dish Modal -->
<div class="modal fade" id="dishModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dishModalLabel">Add Dish</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="dishForm" novalidate>
                    <input type="hidden" id="editDishId">
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label for="dishName" class="form-label">Dish Name *</label>
                            <input type="text" class="form-control" id="dishName" placeholder="e.g. Margherita Pizza" required>
                        </div>
                        <div class="col-md-4">
                            <label for="dishCategory" class="form-label">Category *</label>
                            <select class="form-select" id="dishCategory" required>
                                <option value="" disabled selected>Select</option>
                                <option>Starter</option><option>Main Course</option><option>Pizza</option>
                                <option>Pasta</option><option>Rice</option><option>Bread</option>
                                <option>Dessert</option><option>Beverage</option><option>Snack</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="dishPrice" class="form-label">Price (₹) *</label>
                            <input type="number" class="form-control" id="dishPrice" placeholder="299" required min="0" step="any">
                        </div>
                    </div>
                    <label class="form-label mt-2"><i class="bi bi-list-check me-1"></i> Ingredients</label>
                    <div id="ingredientRows"></div>
                    <button type="button" class="btn btn-outline-custom btn-sm mt-2" onclick="addIngredientRow()">
                        <i class="bi bi-plus me-1"></i> Add Ingredient
                    </button>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary-custom" onclick="saveDish()">Save Dish</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/logs.js"></script>
<script src="js/inventory.js"></script>
<script src="js/recipe.js"></script>
<script>
    let ingRowCount = 0;

    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        renderNavbar('Recipe Menu');
        renderDishes();
    });

    function renderDishes() {
        const dishes = getAllDishes();
        const container = document.getElementById('dishList');
        const empty = document.getElementById('emptyState');
        if (!dishes.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
        empty.style.display = 'none';
        const allInv = getAllIngredients();

        container.innerHTML = dishes.map(dish => {
            const breakdown = (dish.ingredients||[]).map(ing => {
                const inv = allInv.find(i=>i.id===ing.inventoryId);
                return inv ? `${inv.name}: ${ing.qtyRequired}${inv.unit}` : `Unknown: ${ing.qtyRequired}`;
            }).join(' · ');

            let cost = 0;
            (dish.ingredients||[]).forEach(ing => {
                const inv = allInv.find(i=>i.id===ing.inventoryId);
                if (inv) cost += ing.qtyRequired * inv.costPerUnit;
            });
            const margin = dish.price - cost;

            return `<div class="col-md-6 col-xl-4"><div class="card-dark h-100">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div><h6 class="fw-600 mb-1">${dish.dishName}</h6><span class="badge-status badge-info">${dish.category}</span></div>
                    <span class="fw-600 text-blue">${formatCurrency(dish.price)}</span>
                </div>
                <p class="small mb-2" style="color:var(--text-muted);line-height:1.6"><i class="bi bi-list-check me-1"></i>${breakdown || 'No ingredients'}</p>
                <div class="d-flex justify-content-between align-items-center mt-auto pt-2" style="border-top:1px solid var(--border)">
                    <div class="small" style="color:var(--text-secondary)">
                        Cost: ${formatCurrency(cost)} &nbsp;|&nbsp;
                        Margin: <span class="${margin>=0?'text-green':'text-red'} fw-600">${formatCurrency(margin)}</span>
                    </div>
                    <div>
                        <button class="btn btn-ghost" onclick="openEditDish('${dish.id}')" title="Edit"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-ghost text-red" onclick="confirmDeleteDish('${dish.id}','${dish.dishName.replace(/'/g,"\\'")}')" title="Delete"><i class="bi bi-trash3"></i></button>
                    </div>
                </div>
            </div></div>`;
        }).join('');
    }

    function getIngOptions(sel) {
        const inv = getAllIngredients();
        return '<option value="" disabled '+(sel?'':'selected')+'>Select ingredient</option>' +
            inv.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${i.name} (${i.quantity}${i.unit})</option>`).join('');
    }

    function addIngredientRow(invId, qty) {
        ingRowCount++;
        const div = document.createElement('div');
        div.className = 'ingredient-row d-flex gap-2 align-items-center';
        div.innerHTML = `<select class="form-select form-select-sm ing-sel" style="flex:2" required>${getIngOptions(invId||'')}</select>
            <input type="number" class="form-control form-control-sm ing-qty" placeholder="Qty" min="0" step="any" value="${qty||''}" style="flex:1" required>
            <button type="button" class="btn btn-ghost btn-sm text-red" onclick="this.parentElement.remove()"><i class="bi bi-x-lg"></i></button>`;
        document.getElementById('ingredientRows').appendChild(div);
    }

    function openDishForm() {
        document.getElementById('dishModalLabel').textContent = 'Add Dish';
        document.getElementById('dishForm').reset();
        document.getElementById('editDishId').value = '';
        document.getElementById('ingredientRows').innerHTML = '';
        ingRowCount = 0;
        addIngredientRow();
        new bootstrap.Modal(document.getElementById('dishModal')).show();
    }

    function openEditDish(id) {
        const dish = getRecipeById(id); if (!dish) return;
        document.getElementById('dishModalLabel').textContent = 'Edit Dish';
        document.getElementById('editDishId').value = id;
        document.getElementById('dishName').value = dish.dishName;
        document.getElementById('dishCategory').value = dish.category;
        document.getElementById('dishPrice').value = dish.price;
        document.getElementById('ingredientRows').innerHTML = '';
        ingRowCount = 0;
        (dish.ingredients||[]).forEach(ing => addIngredientRow(ing.inventoryId, ing.qtyRequired));
        new bootstrap.Modal(document.getElementById('dishModal')).show();
    }

    function saveDish() {
        const id = document.getElementById('editDishId').value;
        const name = document.getElementById('dishName').value.trim();
        const cat = document.getElementById('dishCategory').value;
        const price = document.getElementById('dishPrice').value;
        if (!name || !cat || !price) { showToast('Fill all required fields.','danger'); return; }

        const rows = document.getElementById('ingredientRows').querySelectorAll('.ingredient-row');
        const ings = []; let valid = true;
        rows.forEach(r => {
            const s = r.querySelector('.ing-sel').value, q = r.querySelector('.ing-qty').value;
            if (!s||!q||parseFloat(q)<=0) { valid = false; return; }
            ings.push({inventoryId:s, qtyRequired:parseFloat(q)});
        });
        if (!valid || !ings.length) { showToast('Add at least one ingredient with valid quantity.','danger'); return; }

        if (id) { editDish(id,{dishName:name,category:cat,price,ingredients:ings}); showToast(name+' updated.','success'); }
        else { addDish({dishName:name,category:cat,price,ingredients:ings}); showToast(name+' added.','success'); }
        bootstrap.Modal.getInstance(document.getElementById('dishModal')).hide();
        renderDishes();
    }

    function confirmDeleteDish(id, name) {
        if (confirm('Delete "'+name+'" from the menu?')) { deleteDish(id); showToast(name+' removed.','danger'); renderDishes(); }
    }
</script>
</body>
</html>
