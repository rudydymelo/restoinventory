<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profit & Loss reports for your restaurant">
    <title>P&L Reports — Smart RestoInventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-content">
        <header class="top-bar" id="topbar-container"></header>
        <div class="page-content">

            <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h1>Profit & Loss Report</h1>
                    <p>Analyze revenue, costs, and profitability by dish and date</p>
                </div>
            </div>

            <!-- Date Range Filter -->
            <div class="card-dark mb-4">
                <div class="d-flex align-items-end gap-3 flex-wrap">
                    <div>
                        <label for="startDate" class="form-label">From</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div>
                        <label for="endDate" class="form-label">To</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    <button class="btn btn-primary-custom" onclick="runReport()">
                        <i class="bi bi-bar-chart-line me-1"></i> Generate Report
                    </button>
                </div>
            </div>

            <!-- Grand Totals -->
            <div class="row g-3 mb-4" id="summaryCards" style="display:none;">
                <div class="col-md-4">
                    <div class="metric-card">
                        <div class="metric-icon green"><i class="bi bi-arrow-up-circle"></i></div>
                        <div class="metric-body">
                            <div class="metric-value metric-positive" id="totalRevenue">—</div>
                            <div class="metric-label">Total Revenue</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="metric-card">
                        <div class="metric-icon amber"><i class="bi bi-cash-stack"></i></div>
                        <div class="metric-body">
                            <div class="metric-value text-amber" id="totalCost">—</div>
                            <div class="metric-label">Total Ingredient Cost</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="metric-card">
                        <div class="metric-icon" id="profitIcon"><i class="bi bi-graph-up-arrow"></i></div>
                        <div class="metric-body">
                            <div class="metric-value" id="netProfit">—</div>
                            <div class="metric-label">Net Profit / Loss</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dish-wise Table -->
            <div class="card-dark mb-4" id="dishWiseCard" style="display:none;">
                <div class="card-dark-header">
                    <h5><i class="bi bi-pie-chart me-1"></i> Dish-wise Profitability</h5>
                </div>
                <div class="table-responsive" id="dishWiseTable"></div>
            </div>

            <!-- Daily Summary -->
            <div class="card-dark" id="dailyCard" style="display:none;">
                <div class="card-dark-header">
                    <h5><i class="bi bi-calendar3 me-1"></i> Daily Summary</h5>
                </div>
                <div class="table-responsive" id="dailyTable"></div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyReport">
                <span class="empty-state-icon">📊</span>
                <p>Select a date range and click "Generate Report" to view your P&L analysis.</p>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/logs.js"></script>
<script src="js/inventory.js"></script>
<script src="js/recipe.js"></script>
<script src="js/billing.js"></script>
<script src="js/reports.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        renderNavbar('P&L Reports');

        // Default date range: last 30 days to today
        const today = new Date();
        const thirtyAgo = new Date(today.getTime() - 30 * 86400000);
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        document.getElementById('startDate').value = thirtyAgo.toISOString().split('T')[0];
    });

    function runReport() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;

        if (!start || !end) { showToast('Please select both dates.','danger'); return; }
        if (new Date(start) > new Date(end)) { showToast('Start date must be before end date.','danger'); return; }

        const report = computeProfitLoss(start, end);

        if (!report.bills.length) {
            document.getElementById('summaryCards').style.display = 'none';
            document.getElementById('dishWiseCard').style.display = 'none';
            document.getElementById('dailyCard').style.display = 'none';
            document.getElementById('emptyReport').style.display = 'block';
            document.getElementById('emptyReport').querySelector('p').textContent = 'No bills found in the selected date range.';
            return;
        }

        document.getElementById('emptyReport').style.display = 'none';
        document.getElementById('summaryCards').style.display = '';
        document.getElementById('dishWiseCard').style.display = '';
        document.getElementById('dailyCard').style.display = '';

        // Summary cards
        document.getElementById('totalRevenue').textContent = formatCurrency(report.totalRevenue);
        document.getElementById('totalCost').textContent = formatCurrency(report.totalCost);

        const profitEl = document.getElementById('netProfit');
        const profitIcon = document.getElementById('profitIcon');
        profitEl.textContent = formatCurrency(Math.abs(report.netProfit));
        if (report.netProfit >= 0) {
            profitEl.className = 'metric-value metric-positive';
            profitEl.textContent = '+' + formatCurrency(report.netProfit);
            profitIcon.className = 'metric-icon green';
            profitIcon.innerHTML = '<i class="bi bi-graph-up-arrow"></i>';
        } else {
            profitEl.className = 'metric-value metric-negative';
            profitEl.textContent = '-' + formatCurrency(Math.abs(report.netProfit));
            profitIcon.className = 'metric-icon red';
            profitIcon.innerHTML = '<i class="bi bi-graph-down-arrow"></i>';
        }

        // Dish-wise table
        document.getElementById('dishWiseTable').innerHTML = `<table class="tbl">
            <thead><tr><th>Dish</th><th>Units Sold</th><th>Revenue</th><th>Ingredient Cost</th><th>Profit / Loss</th></tr></thead>
            <tbody>${report.dishWise.map(d => `<tr>
                <td><strong>${d.dishName}</strong></td>
                <td>${d.unitsSold}</td>
                <td>${formatCurrency(d.revenue)}</td>
                <td>${formatCurrency(d.ingredientCost)}</td>
                <td class="${d.profit>=0?'text-green':'text-red'} fw-600">${d.profit>=0?'+':''}${formatCurrency(d.profit)}</td>
            </tr>`).join('')}</tbody>
        </table>`;

        // Daily summary
        document.getElementById('dailyTable').innerHTML = `<table class="tbl">
            <thead><tr><th>Date</th><th>Revenue</th><th>Cost</th><th>Net P/L</th></tr></thead>
            <tbody>${report.dailySummary.map(d => `<tr>
                <td>${d.date}</td>
                <td>${formatCurrency(d.revenue)}</td>
                <td>${formatCurrency(d.cost)}</td>
                <td class="${d.netPL>=0?'text-green':'text-red'} fw-600">${d.netPL>=0?'+':''}${formatCurrency(d.netPL)}</td>
            </tr>`).join('')}</tbody>
        </table>`;
    }
</script>
</body>
</html>
