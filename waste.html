<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track food waste for SDG 12 compliance">
    <title>Waste Tracker — Smart RestoInventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-content">
        <header class="top-bar" id="topbar-container"></header>
        <div class="page-content">

            <div class="page-header">
                <h1>Waste Tracker</h1>
                <p>Log spoiled, expired, or damaged ingredients — supports SDG 12 food waste reduction</p>
            </div>

            <div class="row g-4">
                <!-- Log Waste Form -->
                <div class="col-lg-5">
                    <div class="card-dark">
                        <div class="card-dark-header">
                            <h5><i class="bi bi-plus-circle me-1"></i> Log Waste</h5>
                        </div>
                        <form id="wasteForm" novalidate>
                            <div class="mb-3">
                                <label for="wasteItem" class="form-label">Ingredient *</label>
                                <select class="form-select" id="wasteItem" required></select>
                            </div>
                            <div class="mb-3">
                                <label for="wasteQty" class="form-label">Quantity *</label>
                                <input type="number" class="form-control" id="wasteQty" placeholder="Amount wasted" min="1" step="any" required>
                            </div>
                            <div class="mb-3">
                                <label for="wasteReason" class="form-label">Reason *</label>
                                <select class="form-select" id="wasteReason" required>
                                    <option value="" disabled selected>Select reason</option>
                                    <option value="Expired">Expired</option>
                                    <option value="Damaged">Damaged</option>
                                    <option value="Spoiled">Spoiled</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-danger-custom w-100">
                                <i class="bi bi-trash3 me-1"></i> Log Waste
                            </button>
                        </form>
                    </div>

                    <!-- Waste Summary Metrics -->
                    <div class="card-dark mt-3">
                        <div class="card-dark-header">
                            <h5><i class="bi bi-graph-down me-1"></i> Waste Summary</h5>
                        </div>
                        <div class="row g-3" id="wasteSummaryCards">
                            <div class="col-6">
                                <div class="text-center">
                                    <div class="metric-value metric-negative" id="totalWasteEntries">0</div>
                                    <div class="metric-label">Total Entries</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="text-center">
                                    <div class="metric-value metric-negative" id="totalWasteCost">₹0.00</div>
                                    <div class="metric-label">Total Waste Cost</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Waste Log Table -->
                <div class="col-lg-7">
                    <div class="card-dark">
                        <div class="card-dark-header">
                            <h5><i class="bi bi-list-ul me-1"></i> Waste Log</h5>
                        </div>
                        <div class="table-responsive" id="wasteTableContainer"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/logs.js"></script>
<script src="js/inventory.js"></script>
<script src="js/waste.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        renderNavbar('Waste Tracker');
        populateItems();
        renderWasteLog();
        updateSummary();
    });

    function populateItems() {
        const inv = getAllIngredients();
        const sel = document.getElementById('wasteItem');
        sel.innerHTML = '<option value="" disabled selected>Select ingredient</option>' +
            inv.map(i=>`<option value="${i.id}">${i.name} (${i.quantity} ${i.unit} available)</option>`).join('');
    }

    document.getElementById('wasteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const inventoryId = document.getElementById('wasteItem').value;
        const qty = document.getElementById('wasteQty').value;
        const reason = document.getElementById('wasteReason').value;

        if (!inventoryId || !qty || parseFloat(qty) <= 0 || !reason) {
            showToast('Please fill all fields.','danger'); return;
        }

        logWaste({ inventoryId, qty: parseFloat(qty), reason });
        showToast('Waste logged successfully.','success');
        this.reset();
        populateItems();
        renderWasteLog();
        updateSummary();
    });

    function renderWasteLog() {
        const waste = getAllWaste();
        const el = document.getElementById('wasteTableContainer');

        if (!waste.length) {
            el.innerHTML = '<div class="empty-state"><span class="empty-state-icon">♻️</span><p>No waste recorded yet. Great job keeping waste low!</p></div>';
            return;
        }

        el.innerHTML = `<table class="tbl">
            <thead><tr><th>Item</th><th>Qty</th><th>Reason</th><th>Date</th></tr></thead>
            <tbody>${waste.map(w => {
                const inv = getIngredientById(w.inventoryId);
                return `<tr>
                    <td><strong>${w.itemName || 'Unknown'}</strong></td>
                    <td>${w.qty} ${inv ? inv.unit : ''}</td>
                    <td><span class="badge-status badge-warning">${w.reason}</span></td>
                    <td class="small" style="color:var(--text-muted)">${formatDate(w.timestamp)}</td>
                </tr>`;
            }).join('')}</tbody>
        </table>`;
    }

    function updateSummary() {
        const summary = getWasteSummary();
        document.getElementById('totalWasteEntries').textContent = summary.totalEntries;
        document.getElementById('totalWasteCost').textContent = formatCurrency(summary.totalWasteCost);
    }
</script>
</body>
</html>
