<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View activity logs for billing, menu, and stock changes">
    <title>Activity Logs — Smart RestoInventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar-container"></aside>
    <main class="main-content">
        <header class="top-bar" id="topbar-container"></header>
        <div class="page-content">

            <div class="page-header">
                <h1>Activity Logs</h1>
                <p>View billing history, menu audits, and stock change records</p>
            </div>

            <div class="card-dark">
                <!-- Tabs -->
                <ul class="nav nav-tabs-clean mb-3" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabBilling" type="button" role="tab">
                            <i class="bi bi-receipt me-1"></i> Billing History
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMenu" type="button" role="tab">
                            <i class="bi bi-journal-richtext me-1"></i> Menu Audit
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabStock" type="button" role="tab">
                            <i class="bi bi-box-seam me-1"></i> Stock History
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="tabBilling" role="tabpanel">
                        <div class="table-responsive" id="billingLogsContainer"></div>
                    </div>
                    <div class="tab-pane fade" id="tabMenu" role="tabpanel">
                        <div class="table-responsive" id="menuLogsContainer"></div>
                    </div>
                    <div class="tab-pane fade" id="tabStock" role="tabpanel">
                        <div class="table-responsive" id="stockLogsContainer"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/logs.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        renderNavbar('Activity Logs');
        renderLogs('billing', 'billingLogsContainer');
        renderLogs('menu', 'menuLogsContainer');
        renderLogs('stock', 'stockLogsContainer');
    });

    function renderLogs(category, containerId) {
        const logs = getLogsByCategory(category);
        const el = document.getElementById(containerId);

        if (!logs.length) {
            el.innerHTML = '<div class="empty-state"><span class="empty-state-icon">📋</span><p>No ' + category + ' logs recorded yet.</p></div>';
            return;
        }

        el.innerHTML = `<table class="tbl">
            <thead><tr><th>Timestamp</th><th>Action</th><th>Details</th></tr></thead>
            <tbody>${logs.map(log => `<tr>
                <td class="small" style="color:var(--text-muted);white-space:nowrap;">${formatDate(log.timestamp)}</td>
                <td>${log.actionText}</td>
                <td class="small" style="color:var(--text-muted)">${log.payload && Object.keys(log.payload).length ? JSON.stringify(log.payload) : '—'}</td>
            </tr>`).join('')}</tbody>
        </table>`;
    }
</script>
</body>
</html>
