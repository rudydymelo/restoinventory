<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart RestoInventory — Restaurant Management System Login">
    <title>Sign In — Smart RestoInventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="auth-brand-icon">🍽️</span>
            <h1>Smart RestoInventory</h1>
            <p>Sign in to your restaurant dashboard</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="loginUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                    <button class="btn btn-outline-custom" type="button" id="togglePassword" title="Show/hide">
                        <i class="bi bi-eye" style="font-size:0.9rem;"></i>
                    </button>
                </div>
            </div>

            <div id="loginError" class="error-inline mb-3">
                <i class="bi bi-exclamation-circle"></i> <span id="loginErrorText"></span>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Sign In</button>
        </form>

        <div class="d-flex justify-content-between">
            <a href="#" class="small" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot password?</a>
            <a href="register.html" class="small">Register restaurant →</a>
        </div>

        <div class="mt-4 pt-3 text-center" style="border-top:1px solid var(--border);">
            <span class="form-text">Demo credentials: <code>admin</code> / <code>admin123</code></span>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-key me-1"></i> Reset Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="resetStep1">
                    <p class="small" style="color:var(--text-secondary)">Enter your username to reset your password.</p>
                    <div class="mb-3">
                        <label for="resetUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="resetUsername" placeholder="Your username" required>
                    </div>
                    <div id="resetError1" class="error-inline mb-2"><i class="bi bi-exclamation-circle"></i> <span id="resetErrorText1"></span></div>
                    <button class="btn btn-primary-custom w-100" id="resetLookupBtn">Find Account</button>
                </div>
                <div id="resetStep2" style="display:none;">
                    <p class="small" style="color:var(--text-secondary)">Set a new password for <strong id="resetForUser"></strong>.</p>
                    <div class="mb-3">
                        <label for="resetNewPassword" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="resetNewPassword" placeholder="New password" required>
                    </div>
                    <div class="mb-3">
                        <label for="resetConfirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="resetConfirmPassword" placeholder="Confirm password" required>
                    </div>
                    <div id="resetError2" class="error-inline mb-2"><i class="bi bi-exclamation-circle"></i> <span id="resetErrorText2"></span></div>
                    <button class="btn btn-primary-custom w-100" id="resetSaveBtn">Reset Password</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script>
    if (getSession()) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value;
        const err = document.getElementById('loginError');
        const errT = document.getElementById('loginErrorText');
        if (!u || !p) { errT.textContent = 'Please enter both fields.'; err.classList.add('visible'); return; }
        const r = loginUser(u, p);
        if (r.success) { err.classList.remove('visible'); window.location.href = 'dashboard.html'; }
        else { errT.textContent = r.message; err.classList.add('visible'); }
    });

    document.getElementById('togglePassword').addEventListener('click', function() {
        const inp = document.getElementById('loginPassword');
        const ic = this.querySelector('i');
        if (inp.type === 'password') { inp.type = 'text'; ic.classList.replace('bi-eye','bi-eye-slash'); }
        else { inp.type = 'password'; ic.classList.replace('bi-eye-slash','bi-eye'); }
    });

    document.getElementById('resetLookupBtn').addEventListener('click', function() {
        const u = document.getElementById('resetUsername').value.trim();
        const err = document.getElementById('resetError1'), errT = document.getElementById('resetErrorText1');
        if (!u) { errT.textContent = 'Please enter a username.'; err.classList.add('visible'); return; }
        if (!usernameExists(u)) { errT.textContent = 'Username not found.'; err.classList.add('visible'); return; }
        err.classList.remove('visible');
        document.getElementById('resetStep1').style.display = 'none';
        document.getElementById('resetStep2').style.display = 'block';
        document.getElementById('resetForUser').textContent = u;
    });

    document.getElementById('resetSaveBtn').addEventListener('click', function() {
        const u = document.getElementById('resetForUser').textContent;
        const pw = document.getElementById('resetNewPassword').value;
        const cpw = document.getElementById('resetConfirmPassword').value;
        const err = document.getElementById('resetError2'), errT = document.getElementById('resetErrorText2');
        if (!pw || pw.length < 4) { errT.textContent = 'Password must be at least 4 characters.'; err.classList.add('visible'); return; }
        if (pw !== cpw) { errT.textContent = 'Passwords do not match.'; err.classList.add('visible'); return; }
        const r = resetPassword(u, pw);
        if (r.success) {
            bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal')).hide();
            document.getElementById('resetStep1').style.display = 'block';
            document.getElementById('resetStep2').style.display = 'none';
            const le = document.getElementById('loginError'), lt = document.getElementById('loginErrorText');
            le.classList.add('visible'); le.style.color = 'var(--green)';
            lt.innerHTML = '✓ ' + r.message;
            setTimeout(() => { le.classList.remove('visible'); le.style.color = ''; }, 4000);
        } else { errT.textContent = r.message; err.classList.add('visible'); }
    });

    (function() {
        const p = new URLSearchParams(window.location.search);
        if (p.get('registered') === 'true') {
            const e = document.getElementById('loginError'), t = document.getElementById('loginErrorText');
            e.classList.add('visible'); e.style.color = 'var(--green)';
            t.innerHTML = '✓ Registration successful! You can now sign in.';
            setTimeout(() => { e.classList.remove('visible'); e.style.color = ''; }, 5000);
            window.history.replaceState({}, '', 'index.html');
        }
    })();
</script>
</body>
</html>
